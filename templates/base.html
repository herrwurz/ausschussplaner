<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AusschussPlaner{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-dark: #1e3a8a;
            --primary: #2563eb;
            --accent-yellow: #fbbf24;
        }
        body { display: flex; min-height: 100vh; }
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary) 100%);
            padding: 25px;
            border-right: 4px solid var(--accent-yellow);
            color: var(--accent-yellow);
        }
        .sidebar a {
            display: block;
            padding: 12px 16px;
            margin: 8px 0;
            text-decoration: none;
            color: var(--accent-yellow);
            border-radius: 8px;
            transition: all 0.3s;
            font-weight: 500;
        }
        .sidebar a:hover {
            background: rgba(251, 191, 36, 0.15);
            color: #fff9e6;
        }
        .sidebar a.active {
            background: rgba(251, 191, 36, 0.2);
            color: #fff9e6;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.2);
        }
        .sidebar hr {
            border-color: rgba(251, 191, 36, 0.3);
        }
        .content { flex: 1; padding: 30px; background: #f8fafc; }
        .navbar-brand {
            font-weight: 900;
            color: var(--accent-yellow);
            font-size: 1.4rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <div class="navbar-brand mb-4">AusschussPlaner</div>
        <a href="/admin" class="{% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/admin/personen" class="{% if page == 'personen' %}active{% endif %}">Personen</a>
        <a href="/admin/ausschuesse" class="{% if page == 'ausschuesse' %}active{% endif %}">Ausschüsse</a>
        <a href="/admin/abwesenheiten" class="{% if page == 'abwesenheiten' %}active{% endif %}">Abwesenheiten</a>
        <a href="/admin/verfuegbarkeiten" class="{% if page == 'verfuegbarkeiten' %}active{% endif %}">Verfügbarkeiten</a>
        <a href="/admin/jahrespläne" class="{% if page == 'jahrespläne' %}active{% endif %}">Jahrespläne</a>
        <a href="/admin/sitzungsregeln" class="{% if page == 'sitzungsregeln' %}active{% endif %}">Sitzungsregeln</a>
        <a href="/admin/sitzungen" class="{% if page == 'sitzungen' %}active{% endif %}">Sitzungstermine</a>
        <hr>
        <a href="/admin/logout" class="btn btn-sm btn-warning w-100">Logout</a>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

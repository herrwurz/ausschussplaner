<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AusschussPlaner{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: #f8f9fa; padding: 20px; border-right: 1px solid #dee2e6; }
        .sidebar a { display: block; padding: 10px; margin: 5px 0; text-decoration: none; color: #333; border-radius: 4px; }
        .sidebar a:hover { background: #e9ecef; }
        .sidebar a.active { background: #0d6efd; color: white; }
        .content { flex: 1; padding: 20px; }
        .navbar-brand { font-weight: bold; color: #0d6efd; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="sidebar">
        <div class="navbar-brand mb-4">AusschussPlaner</div>
        <a href="/admin" class="{% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="/admin/personen" class="{% if page == 'personen' %}active{% endif %}">Personen</a>
        <a href="/admin/ausschuesse" class="{% if page == 'ausschuesse' %}active{% endif %}">Ausschüsse</a>
        <a href="/admin/abwesenheiten" class="{% if page == 'abwesenheiten' %}active{% endif %}">Abwesenheiten</a>
        <a href="/admin/verfuegbarkeiten" class="{% if page == 'verfuegbarkeiten' %}active{% endif %}">Verfügbarkeiten</a>
        <a href="/admin/jahrespläne" class="{% if page == 'jahrespläne' %}active{% endif %}">Jahrespläne</a>
        <a href="/admin/sitzungsregeln" class="{% if page == 'sitzungsregeln' %}active{% endif %}">Sitzungsregeln</a>
        <hr>
        <a href="/admin/logout" class="btn btn-sm btn-outline-secondary w-100">Logout</a>
    </div>
    <div class="content">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
